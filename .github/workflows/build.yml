name: build

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core, no VST3 SDK)
        run: cmake -S . -B build-core -A x64 -DHC_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build-core --config Release
      - name: Test
        run: ctest --test-dir build-core -C Release --output-on-failure
